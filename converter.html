<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React for beginner!</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const MinutesToHours = () => {
        const [amount, setAmount] = React.useState(0);
        const [inverted, setInverted] = React.useState(false);

        const onChange = (event) => {
          setAmount(event.target.value);
        };

        const reset = () => {
          setAmount(0);
        };

        const onFlip = () => {
          reset();
          setInverted((current) => !current);
        };

        return (
          <div>
            <div>
              <label htmlFor="minutes">Minutes</label>
              <input
                type="number"
                id="minutes"
                value={inverted ? amount * 60 : amount}
                placeholder="Minutes"
                disabled={inverted === true}
                onChange={onChange}
              />
            </div>

            <div>
              <label htmlFor="hours">Hours</label>
              <input
                type="number"
                id="hours"
                value={inverted ? amount : Math.round(amount / 60)}
                placeholder="Hours"
                disabled={inverted === false}
                onChange={onChange}
              />
            </div>
            <button onClick={reset}>Reset</button>
            <button onClick={onFlip}>{inverted ? "Turn Back" : "Invert"}</button>
          </div>
        );
      };

      const KmToMiles = () => {
        const [distance, setDistance] = React.useState(0);
        const [inverted, setInverted] = React.useState(false);

        const onChange = (event) => {
          setInverted(Number(event.target.value));
        };

        const reset = () => {
          setDistance(0);
        };

        const onFlip = () => {
          reset();
          setInverted((current) => !current);
        };

        return (
          <div>
            <div>
              <label htmlFor="kilometers">kilometer</label>
              <input
                type="number"
                id="kilometers"
                value={inverted ? distance * 1.609 : distance}
                placeholder="Kilometers"
                disabled={inverted === true}
                onChange={onChange}
              />
            </div>

            <div>
              <label htmlFor="miles">Miles</label>
              <input
                type="number"
                id="miles"
                value={inverted ? distance : Math.round(distance / 1.609)}
                placeholder="Miles"
                disabled={inverted === false}
                onChange={onChange}
              />
            </div>
            <button onClick={reset}>Reset</button>
            <button onClick={onFlip}>{inverted ? "Turn Back" : "Inverted"}</button>
          </div>
        );
      };

      const App = () => {
        const [index, setIndex] = React.useState("xx");
        const onSelect = (event) => {
          setIndex(event.target.value);
        };
        return (
          <div>
            <h1 className="title">Super Converter</h1>
            <select value={index} onChange={onSelect}>
              <option value="xx">Select your converter</option>
              <option value="0">Minutes & Hours</option>
              <option value="1">Km & Miles</option>
            </select>
            <hr />
            {index === "xx" ? <p>Please select your converter.</p> : null}
            {index === "0" ? <MinutesToHours /> : null}
            {index === "1" ? <KmToMiles /> : null}
          </div>
        );
      };
      const root = document.getElementById("root");
      ReactDOM.createRoot(root).render(<App />);
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
